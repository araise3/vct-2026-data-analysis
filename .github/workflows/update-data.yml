name: Update VLR data

# Replaces the manual "run the scraper, then upload the DB" loop: scrapes only
# what is new, regenerates public/data/*.json, and commits the result. Pushing
# to main is what triggers the Cloudflare Pages rebuild -- there is no separate
# deploy step here, and no deploy hook to configure.
#
# The scraper database is NOT in this repo (it is ~8MB of binary that would
# bloat history fast at this commit frequency). It lives in the Actions cache,
# restored at the start of each run and saved again at the end, with a
# db-snapshot release as a durable fallback (see "Restore scraper database"
# steps below). If neither has a copy -- the very first run, or both layers
# lost at once -- the workflow builds the database from scratch itself rather
# than failing: slower for that one run (up to ~1300 requests, roughly an
# hour), but fully unattended. Every run after that restores normally.

on:
  schedule:
    # Every 3 hours. Closed events (nothing live, last match >7 days old) are
    # skipped entirely, so a routine run only costs ~3 requests per event
    # that's actually still active (typically 3-5 of the 15), not all 15.
    # Note: GitHub delays scheduled runs under load, and disables schedules
    # entirely after 60 days of repository inactivity.
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: 'Discard any restored database and scrape everything from scratch, even if the cache/snapshot had a copy. SLOW (roughly an hour of requests to vlr.gg). For recovering from suspected data corruption -- NOT needed just to seed the first run or recover from ordinary cache loss, both of which already happen automatically.'
        type: boolean
        default: false
      backfill_game_ids:
        description: 'One-time backfill of maps.vlr_game_id (VLR''s own opaque per-map id, added after most matches were already scraped -- powers the Performances chart''s per-map links) for every 2026 VCT/EWC match already in the database. Runs ONE extra Overview-tab fetch per match instead of the normal incremental scrape for this run only (~1,950 matches, ~55min) -- not a full re-scrape, and does not discover new matches/events itself, so the very next scheduled run still catches up on anything new. Only needs running once; re-run only if matches scraped after this lands should also get backfilled later.'
        type: boolean
        default: false

# One run at a time. Two concurrent runs would race on both the database cache
# and the push, and queuing is always preferable to either losing a scrape or
# resolving a conflict after the fact.
concurrency:
  group: update-vlr-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # A routine run finishes in a couple of minutes. A from-scratch rebuild
    # (first run, cache+snapshot both lost, or force_full_rebuild) is the
    # ~1300-request/~1hr case CLAUDE.md describes -- 180 gives that real room
    # without letting a genuinely stuck run occupy the single concurrency slot
    # indefinitely (see `concurrency` below).
    timeout-minutes: 180

    env:
      VLR_DB_PATH: data_cache/vlr_vct_2026.db
      VLR_EWC_DB_PATH: data_cache/vlr_ewc_2026.db
      VLR_VCT_2025_DB_PATH: data_cache/vlr_vct_2025.db
      VLR_EWC_2025_DB_PATH: data_cache/vlr_ewc_2025.db
      VLR_VCT_2024_DB_PATH: data_cache/vlr_vct_2024.db
      VLR_VCT_2023_DB_PATH: data_cache/vlr_vct_2023.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt -r data_prep/requirements.txt

      # A cache key is immutable once written, so a fixed key would restore the
      # first run's database forever. Keying on run_id and restoring by prefix
      # gives the intended "load newest, save updated" behaviour.
      - name: Restore scraper database (cache)
        if: inputs.force_full_rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: data_cache
          key: vlr-db-${{ github.run_id }}
          restore-keys: vlr-db-

      # The Actions cache is fast but not durable: entries are evicted after 7
      # days unused, and there is no way to seed one from outside a workflow.
      # A release asset covers both gaps -- it is how the first run gets an
      # existing database at all, and how any later cache loss is recovered
      # without re-scraping the whole season.
      - name: Restore scraper database (release snapshot fallback)
        if: inputs.force_full_rebuild != true && hashFiles('data_cache/vlr_vct_2026.db') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cache miss. Trying the db-snapshot release."
          mkdir -p data_cache
          if gh release download db-snapshot --pattern '*.db' --dir data_cache --clobber; then
            echo "Restored from release snapshot."
          else
            echo "No usable db-snapshot release found."
          fi

      # 2025 historical backfill -- frozen, one-time data (see CLAUDE.md)
      # that will never be re-scraped, so unlike the 2026 DBs above there's
      # no "build from scratch" fallback and no daily refresh: these two
      # files were seeded once into the db-snapshot-2025 release and only
      # need fetching when genuinely absent from data_cache (first run after
      # this step was added, or a cache eviction) -- after that the SAME
      # cache save step below (path: data_cache, the whole directory) keeps
      # them around for free, so this doesn't need its own cache key or a
      # force_full_rebuild guard (that flag is about rebuilding the current
      # season from scratch; it has nothing to do with a frozen prior
      # season). Without this step, every export silently drops 2025 data --
      # confirmed live: the first run after 2025 data was added to the site
      # overwrote it with a 2026-only export within one scheduled cycle,
      # because this workflow had no way to know the 2025 DBs existed.
      - name: Restore 2025 historical databases (release fallback)
        if: hashFiles('data_cache/vlr_vct_2025.db') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data_cache
          if gh release download db-snapshot-2025 --pattern '*.db' --dir data_cache --clobber; then
            echo "Restored 2025 historical DBs from release."
          else
            echo "::warning::No db-snapshot-2025 release found -- 2025 season data will be empty in this export."
          fi

      # Same frozen-season shape as the 2025 restore above, one release
      # earlier (db-snapshot-2023-2024, holding vlr_vct_2023.db and
      # vlr_vct_2024.db -- VCT only, EWC did not exist before 2025). Kept as
      # its own step/release rather than folded into db-snapshot-2025's,
      # since that release is scoped to one season pair and this is a
      # separate one seeded at a different time.
      - name: Restore 2023/2024 historical databases (release fallback)
        if: hashFiles('data_cache/vlr_vct_2024.db') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data_cache
          if gh release download db-snapshot-2023-2024 --pattern '*.db' --dir data_cache --clobber; then
            echo "Restored 2023/2024 historical DBs from release."
          else
            echo "::warning::No db-snapshot-2023-2024 release found -- 2023/2024 season data will be empty in this export."
          fi

      # Neither layer above is guaranteed to have anything -- the very first
      # run ever, or both lost at once. Rather than fail and wait for a human,
      # let the scrapers' own init_db() create a fresh database and scrape
      # everything: slower this one time, but this repo's whole point here is
      # not needing anyone to babysit it. force_full_rebuild wipes on purpose
      # (e.g. suspected corruption); this step just reports what's about to
      # happen so it's visible in the log either way.
      - name: Report database status
        run: |
          mkdir -p data_cache
          if [ "${{ inputs.force_full_rebuild }}" = "true" ]; then
            # Only the current-season files -- force_full_rebuild means
            # "rebuild 2026 from scratch", not "discard the frozen 2025
            # backfill too" (which has no rebuild path and would just cost
            # a redundant release re-download for nothing).
            rm -f "$VLR_DB_PATH" "$VLR_EWC_DB_PATH"
            echo "::warning::force_full_rebuild requested -- discarding any restored database."
          fi
          if [ -f "$VLR_DB_PATH" ]; then
            echo "Database ready: $(du -h "$VLR_DB_PATH" | cut -f1)"
          else
            echo "::warning::No existing database (cache miss, no snapshot, or a forced rebuild)."
            echo "This run will scrape everything from scratch (~1300 requests, ~1hr)."
            echo "Every run after this one restores normally and only fetches what's new."
          fi
          if [ -f "$VLR_VCT_2025_DB_PATH" ]; then
            echo "2025 historical DB ready: $(du -h "$VLR_VCT_2025_DB_PATH" | cut -f1)"
          else
            echo "::warning::No 2025 historical DB present -- 2025 season data will be missing from this export."
          fi

      # Exit codes are meaningful (see failure_exit_code() / ScrapeFailure in the
      # scrapers): 0 clean, 1 incomplete but what landed is valid, 2+ aborted.
      # Only 0 and 1 should reach the export step -- a 2 means vlr.gg refused us
      # and the database is missing whatever this run should have added.
      - name: Scrape VCT
        id: scrape_vct
        run: |
          set +e
          if [ "${{ inputs.backfill_game_ids }}" = "true" ]; then
            echo "backfill_game_ids requested -- running the one-time id backfill instead of the normal incremental scrape."
            python scraper/vlr_vct_scraper.py --backfill-game-ids
          else
            python scraper/vlr_vct_scraper.py --resume
          fi
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ge 2 ]; then
            echo "::error::VCT scraper aborted (exit $code). Not publishing this run."
            exit "$code"
          fi
          if [ "$code" -eq 1 ]; then
            echo "::warning::VCT scrape incomplete (exit 1). Publishing what landed; job will be marked failed."
          fi

      - name: Scrape EWC
        id: scrape_ewc
        run: |
          set +e
          if [ "${{ inputs.backfill_game_ids }}" = "true" ]; then
            echo "backfill_game_ids requested -- running the one-time id backfill instead of the normal incremental scrape."
            python scraper/vlr_ewc_scraper.py --backfill-game-ids
          else
            python scraper/vlr_ewc_scraper.py --resume
          fi
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ge 2 ]; then
            echo "::error::EWC scraper aborted (exit $code). Not publishing this run."
            exit "$code"
          fi
          if [ "$code" -eq 1 ]; then
            echo "::warning::EWC scrape incomplete (exit 1). Publishing what landed; job will be marked failed."
          fi

      # Saved before the export/commit steps so a failure further down still
      # preserves the scraping work this run paid for.
      - name: Save scraper database
        if: always() && steps.scrape_vct.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: data_cache
          key: vlr-db-${{ github.run_id }}

      # Keep the durable recovery copy roughly current. Refreshed once a day
      # (the 03:00 UTC run) rather than every run: it is an 8MB upload, and a
      # snapshot up to 24h stale still saves the entire season's re-scrape.
      # Without this the release would stay frozen at whenever it was seeded,
      # so a cache loss months later would silently cost every scrape since.
      #
      # Uploads the 2026 filenames specifically, NOT a data_cache/*.db glob --
      # data_cache now also holds the frozen 2025 files (restored by the step
      # above), and a wildcard would re-upload those into this rolling
      # current-season release too, duplicating them for no reason (they
      # already have their own permanent db-snapshot-2025 release that is
      # never refreshed, since 2025 data doesn't change).
      - name: Refresh release snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%H)" != "03" ]; then
            echo "Not the daily slot -- skipping snapshot refresh."
            exit 0
          fi
          gh release view db-snapshot >/dev/null 2>&1 || \
            gh release create db-snapshot --title 'Scraper DB snapshot' \
              --notes 'Seed/recovery copy of the scraper SQLite databases for CI. Replaced automatically; not a source of truth.'
          gh release upload db-snapshot "$VLR_DB_PATH" "$VLR_EWC_DB_PATH" --clobber
          echo "Snapshot refreshed."

      # Writes only the files it generates; liquipedia_rosters.json is produced
      # by a separate script and must survive untouched. Never clear this
      # directory wholesale. The script itself refuses to run against a missing
      # or empty database rather than emitting empty JSON over real data.
      - name: Regenerate public/data
        run: python data_prep/export_from_db.py

      # Must run AFTER the export: it derives from the freshly written
      # public/data/player_agents.json (the only published file carrying a
      # real per-day date -- player_buckets.json's `d` is deaths) rather than
      # from the scraper DB, so it has no database dependency of its own.
      - name: Rebuild player-of-the-week card data
        run: python data_prep/build_player_week.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "No data changes -- nothing to publish."
            exit 0
          fi
          git commit -m "Update VLR data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Rebase before pushing: a run can overlap with a manual commit to
          # main, and losing this run's data to a rejected push would mean the
          # scraping was wasted.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main."
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push after 3 attempts."
          exit 1

      # There used to be a step here that turned any non-zero scrape exit code
      # into a hard job failure, on the reasoning that an incomplete scrape
      # shouldn't show up as a green check. Removed: exit 1 ("something failed
      # but what landed is still valid" -- see failure_exit_code() in the
      # scrapers / scraper/README.md's exit-code table) is not just a
      # transient-run signal, it's also the permanent, steady-state result for
      # matches VLR itself never published a box score for -- confirmed real
      # cases in CLAUDE.md (13 EWC 2026 China Qualifier matches, 2 VCT 2025
      # matches), which the scraper correctly leaves as 'partial' and keeps
      # rechecking for up to RECHECK_GRACE_DAYS. While an affected event still
      # has other live/upcoming matches, that recheck (and the exit-1 result)
      # repeats every single run indefinitely -- so this step made the
      # workflow's pass/fail badge permanently red for a known, expected data
      # gap rather than an actionable problem, which is exactly the kind of
      # signal nobody can act on and everyone learns to ignore. The exit-1
      # ::warning:: annotations already emitted by the Scrape VCT / Scrape EWC
      # steps above still give full visibility into which matches/events
      # didn't land, without failing the run over it. A real abort (exit >=2,
      # e.g. vlr.gg refusing the client) still fails the job immediately,
      # inside those same steps -- that path is unaffected by this removal.
