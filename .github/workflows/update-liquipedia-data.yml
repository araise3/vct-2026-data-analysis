name: Update Liquipedia roster data

# Roster/coach data (public/data/liquipedia_rosters.json) used to be a
# point-in-time snapshot: someone had to manually run
# liquipedia_roster_scraper.py's --dump-html (or --html full run) by hand,
# save the output, then run data_prep/build_liquipedia_data.py --html-dir
# against it -- a two-step process nobody remembered to re-run, so team
# pages that changed (a new signing, a substitute swap, a coaching change)
# silently went stale on the live site until someone happened to redo it.
#
# This automates that away with build_liquipedia_data.py's newer --fetch
# mode, which talks to the Liquipedia API directly (no manual dump step).
# Runs once a day, not on the VLR match-data workflow's 3-hour cadence:
# action=parse (the endpoint that resolves Lua-module-merged roster data --
# see extract_roster_from_html's docstring for why raw wikitext alone isn't
# enough) is rate-limited by Liquipedia to 1 request/30s, so a full run
# across ~48-55 teams takes ~25-30 minutes on its own. Team rosters also
# just don't change anywhere near every 3 hours, so daily is already more
# than enough freshness for real changes to land within a day.
#
# Same ToU-compliance requirements as the scraper itself (see
# liquipedia_roster_scraper.py's module docstring): custom User-Agent with
# contact info (LIQUIPEDIA_CONTACT secret below), the API's own rate limit
# respected by fetch_parsed_html, on-disk response caching, and CC-BY-SA
# 3.0 attribution carried through into the output JSON's _meta field.

on:
  schedule:
    # Once daily, offset from the VLR data workflow's 03:00 UTC daily slot
    # (see update-data.yml) so the two don't publish competing commits to
    # public/data at the same moment.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Ignore the on-disk API response cache and re-fetch every team from scratch.'
        type: boolean
        default: false

# One run at a time, and independent of the VLR data workflow's own
# concurrency group -- the two touch different files (this one only ever
# writes public/data/liquipedia_rosters.json) and there's no reason a slow
# roster run should block or wait on the VLR scrape cadence, or vice versa.
concurrency:
  group: update-liquipedia-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    # ~48-55 teams x 32s/request (action=parse's own rate limit) is
    # ~25-30 minutes in the common case; 90 gives real headroom for 429
    # backoff without letting a genuinely stuck run sit on the single
    # concurrency slot indefinitely.
    timeout-minutes: 90

    env:
      LIQUIPEDIA_CONTACT: ${{ secrets.LIQUIPEDIA_CONTACT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      # Response cache (fetch_wikitext/fetch_parsed_html's on-disk cache,
      # scraper/.liquipedia_cache) has a 24h TTL and read_cache() checks
      # that age itself before trusting an entry -- so restoring yesterday's
      # cache is always safe (a stale entry is simply ignored, not served
      # incorrectly) and only ever helps: a same-day retry (workflow_dispatch
      # after a partial failure) skips re-fetching whatever already landed,
      # instead of re-spending the full 32s/team cost on pages that hadn't
      # changed since the first attempt.
      - name: Restore Liquipedia API response cache
        if: inputs.no_cache != true
        uses: actions/cache/restore@v4
        with:
          path: scraper/.liquipedia_cache
          key: liquipedia-cache-${{ github.run_id }}
          restore-keys: liquipedia-cache-

      - name: Fetch rosters and build public/data/liquipedia_rosters.json
        run: |
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            python data_prep/build_liquipedia_data.py --fetch --no-cache
          else
            python data_prep/build_liquipedia_data.py --fetch
          fi

      - name: Save Liquipedia API response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/.liquipedia_cache
          key: liquipedia-cache-${{ github.run_id }}

      # Group composition, tiebreaker rules, and bracket seeding for the
      # currently-live/incomplete VCT stages (TARGET_STAGES in the scraper
      # itself, currently the 4 2026 Stage 2 regions) -- a handful of raw
      # wikitext fetches (action=query, 2.5s/request, not the 32s
      # action=parse the roster fetch above needs), trivial to piggyback on
      # this same daily job rather than standing up a separate workflow.
      # Own cache dir/key so a restore/save failure here can't touch the
      # roster fetch's own cache.
      - name: Restore tournament-structure API response cache
        if: inputs.no_cache != true
        uses: actions/cache/restore@v4
        with:
          path: scraper/.liquipedia_tournament_cache
          key: liquipedia-tournament-cache-${{ github.run_id }}
          restore-keys: liquipedia-tournament-cache-

      - name: Fetch tournament structure and build public/data/tournament_structure.json
        run: |
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            python scraper/liquipedia_tournament_scraper.py --no-cache
          else
            python scraper/liquipedia_tournament_scraper.py
          fi

      - name: Save tournament-structure API response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scraper/.liquipedia_tournament_cache
          key: liquipedia-tournament-cache-${{ github.run_id }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/liquipedia_rosters.json public/data/tournament_structure.json
          if git diff --staged --quiet; then
            echo "No roster or tournament-structure changes -- nothing to publish."
            exit 0
          fi
          git commit -m "Update Liquipedia roster/tournament data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Rebase before pushing: this can overlap with the VLR data
          # workflow's own commit to main (different file, but same branch),
          # and losing this run's data to a rejected push would mean the
          # ~25-30 minutes of scraping was wasted.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main."
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
