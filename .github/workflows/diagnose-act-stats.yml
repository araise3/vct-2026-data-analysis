name: Diagnose Act stats

# One-off, read-only diagnostics for data_prep/fetch_act_stats.py -- either
# --trade-windows (recomputes KAST at several candidate TRADE_WINDOW_MS
# values in one pass per handle) or --dump-round-anomalies (compares each
# match's official round total against the raw round-array/distinct-id
# count to find where a round-count inflation actually originates). Both
# print to the job log and never write to public/data/player_act_stats.json,
# so there's no "Commit and push" step here at all. Own concurrency group
# (not update-act-stats) specifically so a quick check doesn't queue for
# hours behind that workflow's own long --full runs.
#
# HENRIKDEV_API_KEY is the same secret update-act-stats.yml uses.

on:
  workflow_dispatch:
    inputs:
      handles:
        description: 'Space-separated handles to inspect'
        type: string
        required: true
      mode:
        description: 'Which diagnostic to run'
        type: choice
        options:
          - trade-windows
          - round-anomalies
          - kast-detail
          - normal
        default: trade-windows
      trade_windows:
        description: 'Comma-separated trade-window values in ms to test (trade-windows mode only)'
        type: string
        default: '3000,3500,4000,4500,5000,5500,6000,7000'

concurrency:
  group: diagnose-act-stats
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      HENRIKDEV_API_KEY: ${{ secrets.HENRIKDEV_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose
        run: |
          if [ "${{ inputs.mode }}" = "round-anomalies" ]; then
            python data_prep/fetch_act_stats.py --inspect ${{ inputs.handles }} --dump-round-anomalies
          elif [ "${{ inputs.mode }}" = "kast-detail" ]; then
            python data_prep/fetch_act_stats.py --inspect ${{ inputs.handles }} --dump-kast-detail
          elif [ "${{ inputs.mode }}" = "normal" ]; then
            python data_prep/fetch_act_stats.py --inspect ${{ inputs.handles }}
          else
            python data_prep/fetch_act_stats.py --inspect ${{ inputs.handles }} --trade-windows "${{ inputs.trade_windows }}"
          fi
